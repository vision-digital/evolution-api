name: Publish fork container images

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    tags: ['*.*.*']

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.22.1

      - name: Check runtime and publishing regression
        run: node --test Docker/scripts/node-runtime.test.cjs

      - name: API metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=homolog,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
            type=sha,format=long

      - name: Metrics metadata
        id: metrics_meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-metrics
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=homolog,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=tag
            type=sha,format=long

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the fork container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and publish metrics
        id: metrics
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.metrics
          platforms: linux/amd64
          pull: true
          push: true
          build-args: EVOLUTION_IMAGE=ghcr.io/${{ github.repository }}@${{ steps.api.outputs.digest }}
          tags: ${{ steps.metrics_meta.outputs.tags }}
          labels: ${{ steps.metrics_meta.outputs.labels }}

      - name: Verify published AMD64 runtimes
        env:
          API_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.api.outputs.digest }}
          METRICS_IMAGE: ghcr.io/${{ github.repository }}-metrics@${{ steps.metrics.outputs.digest }}
        run: |
          for image in "$API_IMAGE" "$METRICS_IMAGE"; do
            docker run --rm -i --platform linux/amd64 --entrypoint node "$image" < Docker/scripts/node-runtime-smoke.cjs
          done

      - name: Record published image digests
        env:
          API_IMAGE: ghcr.io/${{ github.repository }}@${{ steps.api.outputs.digest }}
          METRICS_IMAGE: ghcr.io/${{ github.repository }}-metrics@${{ steps.metrics.outputs.digest }}
        run: |
          printf 'API: `%s`\n\nMetrics: `%s`\n' "$API_IMAGE" "$METRICS_IMAGE" >> "$GITHUB_STEP_SUMMARY"
